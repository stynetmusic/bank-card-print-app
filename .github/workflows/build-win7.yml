name: Build Windows 7 EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2019

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Install dependencies with strict versions
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pip<22.0"
          pip install setuptools==65.5.0 wheel==0.38.4
          pip install pyinstaller==5.13.0
          pip install PyQt6==6.4.2
          # Если для твоего приложения нужны другие библиотеки, добавь их сюда, например:
          # pip install reportlab==3.6.12 pillow==9.5.0

      - name: Build with PyInstaller
        run: |
          pyinstaller build.spec

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: UF_Print_Cards_Windows7_x64
          path: dist/