name: Build Windows 7 x64 EXE

# Single supported Windows artifact: Win7+ x64 (also runs on Win10/11).
# Do not build the Windows exe on macOS — PyInstaller does not cross-compile.

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  BUILD_TARGET: Windows7_x64
  APP_NAME: UF_Print_Cards_App

jobs:
  build:
    runs-on: windows-2019
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.8.10 (x64)
        uses: actions/setup-python@v5
        with:
          python-version: '3.8.10'
          architecture: x64
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip<25" "setuptools<70" wheel
          pip install -r requirements.txt
          python -c "import PyQt5, PyInstaller; print('PyQt5', PyQt5.QtCore.QT_VERSION_STR); print('PyInstaller', PyInstaller.__version__)"

      - name: Build EXE (onedir)
        run: pyinstaller --noconfirm build.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: UF_Print_Cards_Windows7_x64
          path: dist/UF_Print_Cards_App/
          retention-days: 30
